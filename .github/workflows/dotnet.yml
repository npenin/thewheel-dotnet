name: .NET

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - name: install mono
        run: |
          sudo apt install ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          sudo chmod +r /usr/share/keyrings/mono-official-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install mono-devel libldap2
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libldap.so.2 /usr/lib/x86_64-linux-gnu/libldap-2.5.so.0
          sudo ln -sf /usr/lib/x86_64-linux-gnu/liblber.so.2 /usr/lib/x86_64-linux-gnu/liblber-2.5.so.0
      - name: Restore dependencies
        run: dotnet restore TheWheel.sln
      - name: Build
        run: dotnet build --no-restore  TheWheel.sln
      - name: retrieve test file
        run: wget https://cve.mitre.org/data/downloads/allitems-cvrf-year-2020.xml
      - name: Test
        run: dotnet test --no-build --framework net8.0 --verbosity normal TheWheel.sln
        # - name: Git Version
        #   id: version
        #   uses: codacy/git-version@2.8.7
        #   with:
        #     release-branch: main

      - name: Pack dotnet projects
        run: |
          dotnet pack TheWheel.Lambda -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.Domain -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.WebApi -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.Services -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.Dto -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.OpenXml -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.OpenXml.WebApi -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ServiceBus -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Contracts -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.ControlFlow -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Providers -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Provider.Ldap -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Provider.Mail -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Snow -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Jira -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Fluent -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.DacPac -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.CyberArk -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.ETL.Azure -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          # dotnet pack TheWheel.ETL.Parlot -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
          dotnet pack TheWheel.Mail -p:PackageVersion=${{ github.run_number }} --configuration Release --include-symbols --include-source
      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            *.nupkg
            *.snupkg
      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push *.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
